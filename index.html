<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پرکتیس ماین | Practice Mine</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b; --panel:#101010; --red:#ff1c1c; --red-dim:rgba(255,28,28,.55);
  --text:#ffffff; --muted:#cfcfcf; --green:#2bff72;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:'Vazirmatn',Tahoma,sans-serif; text-align:center;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
/* پس‌زمینه‌ی بلوکی مثل ماینکرفت */
.grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,28,28,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,28,28,.07) 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);
          mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);
}
.blocks{position:fixed; inset:0; z-index:0; pointer-events:none}
.block{
  position:absolute; width:40px; height:40px; background:var(--red);
  opacity:0; box-shadow:0 0 18px var(--red);
  animation:glow 5s ease-in-out forwards;
}
@keyframes glow{0%{opacity:0}30%{opacity:.35}100%{opacity:0}}

main{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:7vh 18px 40px}

/* تیتر */
h1{
  margin:0 0 30px; font-weight:900; color:var(--red);
  font-size:clamp(2.6rem,13vw,5rem); line-height:1.15;
  text-shadow:0 0 14px rgba(255,28,28,.75),0 0 34px rgba(255,28,28,.45);
  animation:flicker 1.6s steps(1,end) 1;
}
@keyframes flicker{
  0%{opacity:0} 8%{opacity:.9} 12%{opacity:.1} 20%{opacity:1} 26%{opacity:.2}
  34%{opacity:1} 40%{opacity:.5} 48%,100%{opacity:1}
}

/* دکمه */
.btn-container{
  position:relative; width:280px; max-width:100%; height:70px; margin:0 auto;
  border-radius:35px; overflow:hidden; display:flex; justify-content:center; align-items:center;
}
.btn-container::before{
  content:''; position:absolute; width:200%; height:200%;
  background:conic-gradient(transparent,transparent,transparent,#ff0000);
  animation:spin 3s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.server-btn{
  position:absolute; inset:3px; background:#0f0f0f; border-radius:33px;
  display:flex; justify-content:center; align-items:center; z-index:10;
  color:#ff0000; font-size:1.5rem; font-weight:700; text-decoration:none; white-space:nowrap;
  text-shadow:0 0 12px #ff0000,0 0 25px rgba(255,0,0,.8);
  outline:none; user-select:none; cursor:pointer;
  transition:background-color .15s,color .15s,transform .15s;
}
.server-btn:hover{background:#1c0505}
.server-btn:active{background:var(--red); color:#0b0b0b; text-shadow:none; transform:scale(.96)}
.server-btn:focus-visible{outline:2px solid var(--red); outline-offset:-6px}

/* آمار */
.stats{display:flex; justify-content:center; gap:16px; margin-top:40px; flex-wrap:wrap}
.stat{
  min-width:150px; padding:16px 24px; background:var(--panel);
  border:1px solid var(--red-dim); border-radius:18px; box-shadow:0 0 14px rgba(255,28,28,.22);
}
.stat-num{display:block; font-size:2.5rem; font-weight:900; color:var(--red); line-height:1.2;
  text-shadow:0 0 12px rgba(255,28,28,.7)}
.stat-label{display:block; margin-top:4px; color:var(--muted)}
.dot{display:inline-block; width:10px; height:10px; margin-left:7px; border-radius:50%; background:#666; transition:background .3s,box-shadow .3s}
.dot.on{background:var(--green); box-shadow:0 0 10px var(--green)}

/* آی‌پی */
.ip{
  margin:44px auto 0; max-width:420px; padding:18px; background:var(--panel);
  border:1px dashed var(--red-dim); border-radius:18px;
}
.ip small{display:block; color:var(--muted); margin-bottom:8px}
.ip-row{display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap}
.ip code{
  font-family:Consolas,monospace; font-size:1.2rem; color:var(--text); direction:ltr; unicode-bidi:isolate;
}
.copy{
  font-family:inherit; font-size:1rem; font-weight:700; color:var(--red); background:#0f0f0f;
  border:1px solid var(--red); border-radius:12px; padding:8px 18px; cursor:pointer;
  transition:background .15s,color .15s;
}
.copy:active:not(:disabled){background:var(--red); color:#0b0b0b}
.copy:disabled{opacity:.4; cursor:default}

/* عنوان سرور و وضعیت */
.server-title{margin-top:56px; line-height:1.4}
.server-title .top{display:block; color:var(--muted); font-size:1.1rem}
.server-title .bottom{display:block; font-size:1.9rem; font-weight:900; color:var(--red); text-shadow:0 0 12px rgba(255,28,28,.7)}
.divider{width:min(320px,80%); height:2px; margin:18px auto 0; border:0; background:var(--red);
  box-shadow:0 0 10px rgba(255,28,28,.8); border-radius:2px}
.status{max-width:420px; margin:20px auto 0; line-height:1.9}
.status strong{font-size:1.2rem}
.status p{margin:6px 0 0; color:var(--muted)}

/* لینک‌ها */
.links{display:flex; justify-content:center; gap:12px; margin-top:34px; flex-wrap:wrap}
.links a{
  min-width:130px; padding:10px 20px; color:var(--text); text-decoration:none; font-weight:700;
  border:1px solid var(--red-dim); border-radius:14px; background:var(--panel);
  transition:border-color .15s,box-shadow .15s;
}
.links a:hover{border-color:var(--red); box-shadow:0 0 14px rgba(255,28,28,.4)}
footer{margin-top:50px; color:#777; font-size:.85rem}

@media (prefers-reduced-motion:reduce){
  .btn-container::before,h1{animation:none}
  .block{display:none}
}
</style>
</head>
<body>
<div class="grid"></div>
<div class="blocks" id="blocks"></div>

<main>
  <h1>پرکتیس ماین</h1>

  <div class="btn-container">
    <a href="#ip" class="server-btn" id="join">ورود به سرور</a>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-num" id="online-count">۰</span>
      <span class="stat-label"><span class="dot" id="online-dot"></span>بازیکن آنلاین</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="registered-count">۰</span>
      <span class="stat-label">ثبت‌نام شده</span>
    </div>
  </div>

  <section class="ip" id="ip">
    <small>آی‌پی سرور</small>
    <div class="ip-row">
      <code id="ip-text">به‌زودی اعلام می‌شود</code>
      <button class="copy" id="copy" disabled>کپی</button>
    </div>
  </section>

  <div class="server-title">
    <span class="top">سرور</span>
    <span class="bottom">پرکتیس ماین</span>
  </div>
  <hr class="divider">

  <div class="status">
    <strong>نخستین سرور</strong>
    <p>این سرور هنوز در حال آماده‌سازی است، اما این سایت در حال حاضر روشن است.</p>
  </div>

  <nav class="links">
    <a href="#" id="discord">دیسکورد</a>
    <a href="#" id="telegram">تلگرام</a>
  </nav>

  <footer>© پرکتیس ماین</footer>
</main>

<script>
// ---- تنظیمات: بعد از راه‌اندازی سرور فقط این‌ها رو پر کن ----
const SERVER_IP = "";                 // مثلا play.example.ir
const stats = { online: 0, registered: 0 };

const fa = n => Number(n).toLocaleString('fa-IR');

function render(){
  document.getElementById('online-count').textContent = fa(stats.online);
  document.getElementById('registered-count').textContent = fa(stats.registered);
  document.getElementById('online-dot').classList.toggle('on', stats.online > 0);
}
render();

// کپی آی‌پی
if (SERVER_IP) {
  document.getElementById('ip-text').textContent = SERVER_IP;
  const btn = document.getElementById('copy');
  btn.disabled = false;
  btn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(SERVER_IP); btn.textContent = 'کپی شد'; }
    catch (e) { btn.textContent = 'دستی کپی کن'; }
    setTimeout(() => btn.textContent = 'کپی', 1800);
  });
}

// بلوک‌های درخشان پس‌زمینه
(function(){
  const box = document.getElementById('blocks');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function spawn(){
    const b = document.createElement('div');
    b.className = 'block';
    const cols = Math.floor(innerWidth / 40), rows = Math.floor(innerHeight / 40);
    b.style.left = Math.floor(Math.random() * cols) * 40 + 'px';
    b.style.top = Math.floor(Math.random() * rows) * 40 + 'px';
    box.appendChild(b);
    setTimeout(() => b.remove(), 5200);
  }
  setInterval(spawn, 700);
})();
</script>
</body>
</html>
